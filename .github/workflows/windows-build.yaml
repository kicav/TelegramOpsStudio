name: Build Windows App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build TelegramOpsStudio.exe
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile-check source
        shell: pwsh
        run: python -m compileall -q main.py app scripts tests

      - name: Run tests
        shell: pwsh
        run: python -m pytest tests -q

      - name: Build Windows executable with Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=onefile `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --output-dir=dist `
            --output-filename=TelegramOpsStudio.exe `
            --include-package=keyring.backends `
            --assume-yes-for-downloads `
            main.py

      - name: Verify executable and create checksum
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/TelegramOpsStudio.exe")) {
            throw "Build failed: dist/TelegramOpsStudio.exe was not created."
          }
          $hash = (Get-FileHash "dist/TelegramOpsStudio.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  TelegramOpsStudio.exe" | Set-Content -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Item "dist/TelegramOpsStudio.exe" | Format-List Name,Length,LastWriteTime
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: TelegramOpsStudio-Windows-${{ github.sha }}
          path: |
            dist/TelegramOpsStudio.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/TelegramOpsStudio.exe" "dist/SHA256SUMS.txt" --clobber
          }
          else {
            gh release create $tag "dist/TelegramOpsStudio.exe" "dist/SHA256SUMS.txt" --title "Telegram Ops Studio $tag" --generate-notes
          }
