name: Build Windows App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TELEGRAM_OPS_DATA_DIR: ${{ runner.temp }}\TelegramOpsStudioTestData

jobs:
  build-windows:
    name: Test and build TelegramOpsStudio.exe
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate repository layout
        shell: pwsh
        run: |
          $required = @(
            "main.py",
            "requirements.txt",
            "requirements-dev.txt",
            "app/db.py",
            "app/ui.py",
            "tests/test_project_layout.py"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required file is missing: $file" }
          }
          Get-ChildItem -Force

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Project preflight and version consistency
        shell: pwsh
        run: |
          python scripts/preflight.py
          python scripts/check_version.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile-check source
        shell: pwsh
        run: python -m compileall -q main.py app scripts tests

      - name: Import smoke test
        shell: pwsh
        run: |
          python -c "import PySide6, telethon, keyring, openpyxl, socks; from app import db, telegram_service, ui; print('IMPORT_SMOKE_OK')"

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Source runtime self-tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python main.py --self-test
          python main.py --ui-self-test

      - name: Build Windows executable with Nuitka
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python -m nuitka `
            --mode=onefile `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --msvc=latest `
            --output-dir=dist `
            --output-filename=TelegramOpsStudio.exe `
            --include-package=keyring.backends `
            --include-package=win32ctypes `
            --product-name="Telegram Ops Studio" `
            --file-description="Telegram Ops Studio" `
            --file-version=1.0.0.0 `
            --product-version=1.0.0.0 `
            --report=dist/nuitka-report.xml `
            --assume-yes-for-downloads `
            main.py

      - name: Run built executable self-tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if (-not (Test-Path "dist/TelegramOpsStudio.exe")) {
            throw "Build failed: dist/TelegramOpsStudio.exe was not created."
          }
          & "dist/TelegramOpsStudio.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Built executable runtime self-test failed with exit code $LASTEXITCODE" }
          & "dist/TelegramOpsStudio.exe" --ui-self-test
          if ($LASTEXITCODE -ne 0) { throw "Built executable UI self-test failed with exit code $LASTEXITCODE" }

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/TelegramOpsStudio.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  TelegramOpsStudio.exe" | Set-Content -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Item "dist/TelegramOpsStudio.exe" | Format-List Name,Length,LastWriteTime
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: TelegramOpsStudio-Windows-${{ github.sha }}
          path: |
            dist/TelegramOpsStudio.exe
            dist/SHA256SUMS.txt
            dist/nuitka-report.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics if build failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TelegramOpsStudio-build-diagnostics-${{ github.sha }}
          path: |
            dist/nuitka-report.xml
            nuitka-crash-report.xml
            *.nuitka-crash-report.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v') && success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $sha = (Get-FileHash "dist/TelegramOpsStudio.exe" -Algorithm SHA256).Hash.ToLower()
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/TelegramOpsStudio.exe"
          $manifest = [ordered]@{ version=$version; url=$downloadUrl; sha256=$sha } | ConvertTo-Json
          $manifest | Set-Content -Encoding utf8 "dist/update-manifest.json"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/TelegramOpsStudio.exe" "dist/SHA256SUMS.txt" "dist/update-manifest.json" --clobber
          } else {
            gh release create $tag "dist/TelegramOpsStudio.exe" "dist/SHA256SUMS.txt" "dist/update-manifest.json" --title "Telegram Ops Studio $tag" --generate-notes
          }
