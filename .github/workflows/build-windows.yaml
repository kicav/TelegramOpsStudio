name: Build Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'app.py'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/build-windows.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test before build
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build standalone EXE
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramOpsStudio-windows-standalone
          path: release/TelegramOpsStudio/**
          if-no-files-found: error
          retention-days: 14
