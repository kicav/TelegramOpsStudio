name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ./scripts/test.ps1
      - name: Build standalone
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path release\TelegramOpsStudio\* -DestinationPath TelegramOpsStudio-Portable-${{ github.ref_name }}.zip
          (Get-FileHash TelegramOpsStudio-Portable-${{ github.ref_name }}.zip -Algorithm SHA256).Hash.ToLower() + "  TelegramOpsStudio-Portable-${{ github.ref_name }}.zip" | Out-File SHA256SUMS.txt -Encoding ascii
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/build_installer.ps1 -Version $version
          $installer = Get-ChildItem release\installer\TelegramOpsStudioSetup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Installer was not produced" }
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $installer.Name | Add-Content SHA256SUMS.txt -Encoding ascii
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release\installer\TelegramOpsStudioSetup-*.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" `
            "TelegramOpsStudio-Portable-${{ github.ref_name }}.zip" `
            "$($installer.FullName)" `
            "SHA256SUMS.txt" `
            --verify-tag `
            --generate-notes
