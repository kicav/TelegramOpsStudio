name: Build Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'app.py'
      - 'pyproject.toml'
      - 'scripts/build.ps1'
      - 'scripts/configure_deploy_spec.py'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test before build
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m compileall -q src tests app.py
          ruff check src tests app.py
          pytest
          python -m telegram_workflow --self-check
      - name: Build standalone EXE
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramWorkflow-windows-standalone
          path: dist/**
          if-no-files-found: error
          retention-days: 14
