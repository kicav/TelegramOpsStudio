name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          $env:PYTHONPATH = "src"
          ruff check src tests app.py
          pytest
          python -m telegram_workflow --self-check
      - name: Build standalone
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath TelegramWorkflow-Portable-${{ github.ref_name }}.zip
          (Get-FileHash TelegramWorkflow-Portable-${{ github.ref_name }}.zip -Algorithm SHA256).Hash.ToLower() + "  TelegramWorkflow-Portable-${{ github.ref_name }}.zip" | Out-File SHA256SUMS.txt -Encoding ascii
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "TelegramWorkflow-Portable-${{ github.ref_name }}.zip" `
            "SHA256SUMS.txt" `
            --verify-tag `
            --generate-notes
