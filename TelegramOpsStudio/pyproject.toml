[project]
name = "telegram-ops-studio"
version = "0.1.0"
description = "Permission-aware Telegram operations desktop app"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "Telethon>=1.44,<2",
  "openpyxl>=3.1",
  "keyring>=25",
  "PySocks>=1.7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
