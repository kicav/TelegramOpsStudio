[project]
name = "telegram-ops-studio"
version = "1.0.0"
description = "Permission-aware Telegram operations desktop app"
requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6==6.11.1",
  "Telethon==1.44.0",
  "openpyxl==3.1.5",
  "keyring==25.7.0",
  "PySocks==1.7.1",
  "packaging>=24,<26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
